ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Não expor no host. Acesso HTTPS somente pelo Nginx."
options:
  admin_emails: []
  public_url: ""
  google_client_id: ""
  google_client_secret: ""
  test_email_1: ""
  test_invite_1: ""
  test_email_2: ""
  test_invite_2: ""
  test_email_3: ""
  test_invite_3: ""
  test_email_4: ""
  test_invite_4: ""
  test_email_5: ""
  test_invite_5: ""
schema:
  admin_emails:
    - str
  public_url: str
  google_client_id: str
  google_client_secret: password
  test_email_1: str
  test_invite_1: password
  test_email_2: str
  test_invite_2: password
  test_email_3: str
  test_invite_3: password
  test_email_4: str
  test_invite_4: password
  test_email_5: str
  test_invite_5: password
environment:
  HOST: "0.0.0.0"
  PORT: "8099"
  DATA_DIR: /data
  PILOT_OPTIONS_FILE: /data/options.json
