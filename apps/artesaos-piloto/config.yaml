name: "Artesão Digital — Testes"
version: "0.2.0-dev.14"
slug: artesaos_piloto
description: "Teste separado de login Google, convites e contas isoladas. Somente dados fictícios."
arch:
  - aarch64
startup: application
boot: manual
backup: cold
stage: experimental
ingress: false
webui: "https://[HOST]:[PORT:8443]/artesaos-piloto/login"
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Não expor no host. Acesso HTTPS somente pelo Nginx."
options:
  admin_emails: []
  public_url: ""
  google_client_id: ""
  google_client_secret: ""
  smtp_host: ""
  smtp_port: ""
  smtp_user: ""
  smtp_password: ""
  smtp_from: ""
schema:
  admin_emails:
    - str
  public_url: str
  google_client_id: str
  google_client_secret: password
  smtp_host: str
  smtp_port: str
  smtp_user: str
  smtp_password: password
  smtp_from: str
environment:
  ARTESAO_DISTRIBUTION: "home-assistant"
  HOST: "0.0.0.0"
  PORT: "8099"
  DATA_DIR: /data
  PILOT_OPTIONS_FILE: /data/options.json
